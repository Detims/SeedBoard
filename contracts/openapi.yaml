openapi: 3.1.0
info:
  title: Modernizer Local API
  version: 1.0.0
  description: >-
    Loopback-only API for snapshots and local scan orchestration. Repository-root
    registration is performed by the local CLI, not by browser requests.
servers:
  - url: http://127.0.0.1:4317/api/v1
    description: Local development default; production port may be configured.
tags:
  - name: projects
  - name: scans
  - name: snapshots
  - name: layouts
  - name: suggestions
  - name: health
paths:
  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      responses:
        "200":
          description: Registered projects. Filesystem roots are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /projects/{projectId}/scans:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [scans]
      operationId: startScan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        "202":
          description: Scan queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanQueuedResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /scans/{scanId}:
    parameters:
      - $ref: "#/components/parameters/ScanId"
    get:
      tags: [scans]
      operationId: getScan
      responses:
        "200":
          description: Current or terminal scan state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /scans/{scanId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ScanId"
    post:
      tags: [scans]
      operationId: cancelScan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        "200":
          description: Current cancellation state; operation is idempotent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /projects/{projectId}/snapshots:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [snapshots]
      operationId: listSnapshots
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Snapshot summaries ordered by capture time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /snapshots/{snapshotId}:
    parameters:
      - $ref: "#/components/parameters/SnapshotId"
    get:
      tags: [snapshots]
      operationId: getSnapshot
      responses:
        "200":
          description: Validated immutable snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /snapshots/{snapshotId}/diff:
    parameters:
      - $ref: "#/components/parameters/SnapshotId"
    get:
      tags: [snapshots]
      operationId: compareSnapshots
      parameters:
        - name: base
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
      responses:
        "200":
          description: Added, removed and changed entities between snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /projects/{projectId}/layouts/{name}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: name
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
    get:
      tags: [layouts]
      operationId: getLayout
      responses:
        "200":
          description: Saved component positions and viewport.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayoutResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [layouts]
      operationId: saveLayout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayoutInput"
      responses:
        "200":
          description: Layout saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
  /projects/{projectId}/suggestion-decisions/{fingerprint}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: fingerprint
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 160
    put:
      tags: [suggestions]
      operationId: decideSuggestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestionDecisionInput"
      responses:
        "200":
          description: Current planning decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionDecisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /snapshots/{snapshotId}/export:
    parameters:
      - $ref: "#/components/parameters/SnapshotId"
    get:
      tags: [snapshots]
      operationId: exportSnapshot
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [json, backlog, appendix]
      responses:
        "200":
          description: Sanitized snapshot, backlog or documentation appendix.
          content:
            application/json:
              schema:
                $ref: "./snapshot.schema.json"
            text/markdown:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /healthz:
    get:
      tags: [health]
      operationId: getModernizerReadiness
      responses:
        "200":
          description: Modernizer service readiness, unrelated to target application health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 160 }
    ScanId:
      name: scanId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 160 }
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 160 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 2048 }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Active scan conflict or incompatible snapshot comparison.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Scan request rate limit reached.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooLarge:
      description: Request exceeds a configured bound.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServiceUnavailable:
      description: Local storage or service is unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string, minLength: 1 }
        nextCursor: { type: [string, "null"], maxLength: 2048 }
    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error: { $ref: "#/components/schemas/Error" }
        meta: { $ref: "#/components/schemas/Meta" }
    ProjectSummary:
      type: object
      additionalProperties: false
      required: [id, name, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    ProjectListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ProjectSummary" } }
        meta: { $ref: "#/components/schemas/Meta" }
    ScanState:
      type: string
      enum: [queued, running, cancelling, succeeded, partial, failed, cancelled, interrupted]
    ScanJob:
      type: object
      additionalProperties: false
      required: [id, projectId, state, stage, issues, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        state: { $ref: "#/components/schemas/ScanState" }
        stage: { type: string }
        progress:
          type: object
          additionalProperties: false
          required: [completed, total]
          properties:
            completed: { type: integer, minimum: 0 }
            total: { type: [integer, "null"], minimum: 0 }
        issues: { type: array, items: { type: string } }
        snapshotId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ScanQueuedResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/ScanJob" }
        meta: { $ref: "#/components/schemas/Meta" }
    ScanResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/ScanJob" }
        meta: { $ref: "#/components/schemas/Meta" }
    SnapshotSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          projectId,
          capturedAt,
          assessmentStatus,
          componentCount,
          relationshipCount,
          sourceRevision,
        ]
      properties:
        id: { type: string }
        projectId: { type: string }
        capturedAt: { type: string, format: date-time }
        assessmentStatus: { type: string, enum: [complete, partial] }
        componentCount: { type: integer, minimum: 0 }
        relationshipCount: { type: integer, minimum: 0 }
        sourceRevision: { type: [string, "null"] }
    SnapshotListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/SnapshotSummary" } }
        meta: { $ref: "#/components/schemas/Meta" }
    SnapshotResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "./snapshot.schema.json" }
        meta: { $ref: "#/components/schemas/Meta" }
    DiffResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [baseSnapshotId, targetSnapshotId, added, removed, changed]
          properties:
            baseSnapshotId: { type: string }
            targetSnapshotId: { type: string }
            added: { type: array, items: { type: string } }
            removed: { type: array, items: { type: string } }
            changed:
              type: array
              items:
                type: object
                required: [id, fields]
                properties:
                  id: { type: string }
                  fields: { type: array, items: { type: string } }
        meta: { $ref: "#/components/schemas/Meta" }
    LayoutInput:
      type: object
      additionalProperties: false
      required: [positions, viewport, pinnedIds]
      properties:
        positions:
          type: object
          maxProperties: 2000
          additionalProperties:
            type: object
            additionalProperties: false
            required: [x, y]
            properties:
              x: { type: number, minimum: -100000, maximum: 100000 }
              y: { type: number, minimum: -100000, maximum: 100000 }
        viewport:
          type: object
          additionalProperties: false
          required: [x, y, zoom]
          properties:
            x: { type: number, minimum: -100000, maximum: 100000 }
            y: { type: number, minimum: -100000, maximum: 100000 }
            zoom: { type: number, exclusiveMinimum: 0, maximum: 10 }
        pinnedIds:
          type: array
          maxItems: 2000
          uniqueItems: true
          items: { type: string, maxLength: 160 }
    LayoutResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          allOf:
            - $ref: "#/components/schemas/LayoutInput"
            - type: object
              required: [projectId, name, version, updatedAt]
              properties:
                projectId: { type: string }
                name: { type: string }
                version: { type: integer, minimum: 1 }
                updatedAt: { type: string, format: date-time }
        meta: { $ref: "#/components/schemas/Meta" }
    SuggestionDecisionInput:
      type: object
      additionalProperties: false
      required: [state, reason]
      properties:
        state: { type: string, enum: [open, accepted, dismissed] }
        reason: { type: string, maxLength: 1000 }
    SuggestionDecisionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          allOf:
            - $ref: "#/components/schemas/SuggestionDecisionInput"
            - type: object
              required: [projectId, fingerprint, updatedAt]
              properties:
                projectId: { type: string }
                fingerprint: { type: string }
                updatedAt: { type: string, format: date-time }
        meta: { $ref: "#/components/schemas/Meta" }
    HealthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [service, ready]
          properties:
            service: { const: modernizer-api }
            ready: { type: boolean }
        meta: { $ref: "#/components/schemas/Meta" }
